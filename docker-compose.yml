services:
  mysql:
    image: mysql:8.0
    container_name: geo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: community
    # 2C2G 调优：performance_schema 默认吃 200M+ 纯属浪费；buffer pool 压到 128M
    command: >
      --performance-schema=OFF
      --innodb-buffer-pool-size=128M
      --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks:
      - geo-network

  redis:
    image: redis:7-alpine
    container_name: geo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    mem_limit: 96m
    networks:
      - geo-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: geo-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      # 内存水位降到 60%（默认 0.4 会过早限流，1.0 又会把宿主拖垮）
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: "0.6"
    # 管理台只绑回环：服务器上可用 SSH 隧道访问，公网不可达
    ports:
      - "127.0.0.1:15672:15672"
    mem_limit: 320m
    networks:
      - geo-network

  app:
    build: .
    container_name: geo-app
    restart: unless-stopped
    # 只绑回环地址：公网无法直连后端（必须经 nginx），但可在服务器上直接 curl 或用 SSH 隧道排查
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker,prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/community?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      # 生产密钥必须在.env或环境变量中显式配置，不使用开发占位值
      JWT_SECRET: ${JWT_SECRET:?请设置随机JWT_SECRET}
      # 内置管理员 luan 的初始密码。仅在管理员账号首次创建时生效，之后改这里不会覆盖已有密码
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:?请设置ADMIN_INIT_PASSWORD}
      # 阿里云 OSS（可选：不配则图片上传不可用，其余功能正常）
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
    mem_limit: 560m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - geo-network

  nginx:
    image: nginx:1.25-alpine
    container_name: geo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    mem_limit: 48m
    depends_on:
      - app
    networks:
      - geo-network

networks:
  geo-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
